# Inference Configuration

model:
  checkpoint_path: "outputs/models/best_model.ckpt"
  device: "cuda"  # or "cpu"

data:
  test_dir: "data/test"
  output_dir: "outputs/predictions"
  batch_size: 1  # Process one at a time for full resolution
  num_workers: 2

inference:
  tta: true  # Test-time augmentation
  tta_transforms:
    - "none"
    - "horizontal_flip"
    - "vertical_flip"

  # Multi-scale inference
  multiscale: false
  scales: [0.75, 1.0, 1.25]

  # Post-processing
  post_process:
    bilateral_filter:
      enabled: true
      d: 5
      sigma_color: 10
      sigma_space: 10

    unsharp_mask:
      enabled: true
      amount: 0.5
      radius: 2.0

ensemble:
  enabled: false
  model_paths:
    - "outputs/models/model1.ckpt"
    - "outputs/models/model2.ckpt"
    - "outputs/models/model3.ckpt"
  weights: [0.4, 0.3, 0.3]

output:
  format: "jpg"
  quality: 95
  preserve_filename: true
  create_submission_zip: true
  submission_path: "submission.zip"

seed: 42
