# Advanced Swin-TPS Training Configuration (Run 2)
# Changes from Run 1:
#   - Added L1 pixel loss (w_l1=1.0) for stable gradient signal
#   - Reduced w_tps_smooth 0.5 -> 0.15 (was strangling grid deformation)
#   - Reduced w_edge 3.0 -> 2.0 (was saturating, dominating loss)
#   - Increased w_lpips 1.0 -> 1.5 (stronger perceptual guidance)
#   - Increased LR 5e-4 -> 1e-3 (fast test showed this works)
#   - Faster cosine restarts T_0=5 (more escape opportunities)
#   - Increased patience 15 -> 20 (room for post-restart recovery)

model:
  type: "swin_tps"
  encoder: "swin_tiny_patch4_window7_224"
  pretrained: true
  grid_size: 10
  image_size: [224, 224]

loss:
  type: "tps_perceptual"
  w_l1: 1.0
  w_lpips: 1.5
  w_edge: 2.0
  w_tps_smooth: 0.15

training:
  batch_size: 6
  accumulate_grad_batches: 3  # Effective batch = 18
  num_epochs: 50
  lr: 1.0e-3
  weight_decay: 1.0e-4
  precision: "16-mixed"

  T_0: 5
  T_mult: 2
  eta_min: 1.0e-6

  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

data:
  data_dir: "data"
  val_split: 0.15
  num_workers: 4
  pin_memory: true
  persistent_workers: true

callbacks:
  early_stopping:
    monitor: "val_loss"
    patience: 20
    mode: "min"
    min_delta: 0.0005

  model_checkpoint:
    monitor: "val_ssim"
    mode: "max"
    save_top_k: 3
    filename: "swin_tps_v2-{epoch:02d}-{val_ssim:.4f}"

logging:
  project: "lens-correction"
  name: "swin-tps-v2"
  log_every_n_steps: 25
  save_dir: "outputs/logs"

seed: 42
