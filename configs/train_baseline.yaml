# Baseline U-Net Training Configuration

model:
  name: "unet_baseline"
  encoder: "efficientnet-b3"
  decoder_channels: [256, 128, 64, 32, 16]
  encoder_weights: "imagenet"
  activation: null  # No activation (regression task)
  estimate_params: false  # Don't predict distortion params yet

loss:
  type: "geometric"
  weights:
    pixel: 1.0      # L1 pixel loss
    edge: 2.0       # Edge alignment
    ssim: 1.0       # Structural similarity
    gradient: 1.5   # Gradient orientation
    line: 0.0       # Line straightness (disabled for baseline)

training:
  batch_size: 8
  accumulate_grad_batches: 2  # Effective batch size = 16
  num_epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  precision: "16-mixed"  # Mixed precision training

  # Learning rate schedule
  scheduler:
    type: "cosine"
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

  # Gradient clipping
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

data:
  data_dir: "data"
  train_size: 512  # Image size for training
  val_split: 0.15
  num_workers: 4
  pin_memory: true
  persistent_workers: true

augmentation:
  random_crop: true
  horizontal_flip: 0.5
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.0
  gaussian_noise: 0.3
  blur: 0.2

callbacks:
  early_stopping:
    monitor: "val_loss"
    patience: 10
    mode: "min"
    min_delta: 0.001

  model_checkpoint:
    monitor: "val_ssim"
    mode: "max"
    save_top_k: 3
    filename: "unet_baseline-{epoch:02d}-{val_ssim:.4f}"

  learning_rate_monitor:
    logging_interval: "step"

logging:
  project: "lens-correction"
  name: "unet-baseline"
  log_every_n_steps: 50
  save_dir: "outputs/logs"

seed: 42
